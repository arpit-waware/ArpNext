<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — ArpNext</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
    <script type="module" src="src/js/login.js"></script>
</head>

<body class="auth-page"><a class="auth-brand brand" href="index.html"><img class="brand-logo"
            src="assets/arpnext-logo.svg" alt="ArpNext logo" data-brand-logo><span data-brand-name>Arp<span
                class="brand-accent">Next</span></span></a>
    <main class="auth-wrap">
        <div class="auth-card"><span class="section-kicker">WELCOME BACK</span>
            <h1>Good to see you.</h1>
            <p class="section-description">Log in to continue your learning journey.</p>
            <form class="auth-form" id="loginForm"><label>Email address<input id="email" type="email"
                        autocomplete="email" placeholder="you@example.com" required></label><label>Password<input
                        id="password" type="password" autocomplete="current-password" placeholder="Enter your password"
                        required></label><button class="button button-full" id="loginButton" type="submit">Log in
                    <span>→</span></button>
                <p class="form-message" id="formMessage" aria-live="polite"></p>
            </form>
            <p class="auth-switch">New to ArpNext? <a href="signup.html">Create an account</a></p>
            <p class="auth-footnote">Your account is securely managed by Firebase Authentication.</p>
        </div>
    </main>
</body>

</html>
